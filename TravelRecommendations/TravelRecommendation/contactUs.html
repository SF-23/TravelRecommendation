<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>
<nav>
    <h1>Travel Delight</h1>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="aboutUs.html">About Us</a></li>
        <li><a href="contactUs.html">Contact Us</a></li>
    </ul>
</nav>

<main class = "contact-container">
    <section class="contactUsTxt">
        <h1>Contact Us</h1>
        <p>Get in touch with us! Send a message using the form on the right.</p>
    </section>

    <section class="contactForm">
        <div>
            <label for="name">Name:</label><br>
            <input type="text" id="name" placeholder="Your Name">
        </div>
        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" placeholder="Your Email">
        </div>
        <div>
            <label for="messageUs">Message Us:</label><br>
            <textarea id="messageUs" name="message" rows="5" cols="40" placeholder="Enter your message"></textarea>
        </div>
        <button  id="contactSubmit" type="submit">Submit</button>
    </section>
</main>


</body>
</html>
